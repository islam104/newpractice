name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B ci-build -A x64

      - name: Build
        run: cmake --build ci-build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: practica-release
          path: ci-build/Release/practica.exe
